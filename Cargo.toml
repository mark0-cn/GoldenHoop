[workspace]
members = ["crates/protocol", "crates/core", "crates/runtime", "crates/agent", "crates/docker", "crates/store", "crates/control", "crates/client", "crates/cli", "crates/artifacts", "crates/jupyter", "crates/policy", "crates/egress", "crates/credentials"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/mark0-cn/GoldenHoop"

[workspace.dependencies]
goldenhoop-protocol = { path = "crates/protocol" }
goldenhoop-core = { path = "crates/core" }
goldenhoop-runtime = { path = "crates/runtime" }
goldenhoop-store = { path = "crates/store" }
goldenhoop-docker = { path = "crates/docker" }
goldenhoop-client = { path = "crates/client" }
goldenhoop-artifacts = { path = "crates/artifacts" }
goldenhoop-jupyter = { path = "crates/jupyter" }
goldenhoop-policy = { path = "crates/policy" }
goldenhoop-egress = { path = "crates/egress" }
goldenhoop-credentials = { path = "crates/credentials" }
idna = "1.1.0"
ipnet = "2.12.2"
hickory-proto = { version = "=0.26.4", default-features = false, features = ["std"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha2_11 = { package = "sha2", version = "0.11" }
hmac = "0.13"
zeroize = "1"
tokio = { version = "1.54", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
utoipa = { version = "5", features = ["chrono", "uuid"] }
uuid = { version = "1", features = ["serde", "v4"] }
base64 = "0.22"
cap-std = "4"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
tempfile = "3"
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }
futures-util = "0.3"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite"] }
axum = { version = "0.8.9", features = ["ws"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "stream", "rustls"] }
subtle = "2.6"
async-stream = "0.3"
tower = { version = "0.5", features = ["limit", "util"] }
fs2 = "0.4.3"
object_store = { version = "0.14.2", default-features = false, features = ["fs", "aws"] }
bytes = "1"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
