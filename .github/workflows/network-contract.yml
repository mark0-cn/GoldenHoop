name: Network boundary contract
on:
  workflow_dispatch:
    inputs:
      creation_only:
        description: Run only the full five-level public creation/recovery contract
        type: boolean
        default: false
      credential_only:
        description: Run only production credential broker and native convergence
        type: boolean
        default: false
  workflow_call:
    inputs:
      creation_only:
        type: boolean
        default: false
      credential_only:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  host-netfilter:
    if: ${{ !inputs.creation_only && !inputs.credential_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the trusted base and disposable network fixture
        run: |
          docker build --label dev.goldenhoop.build=network-prerequisites -f images/agent/Dockerfile -t goldenhoop-agent:test .
          docker build --target host-egress -f images/agent/Dockerfile -t goldenhoop-egress:test .
          docker build -f tests/fixtures/network.Dockerfile -t goldenhoop-network-fixture:test .
      - name: Check host packet-filter primitives without publishing a policy
        run: python3 -B tests/network_capabilities.py --output evidence/network-prerequisites.json
      - name: Verify actual Rust unreferenced DNS set expiry and collection
        run: python3 -B tests/dns_set_probe.py --rust --output evidence/dns-set-staging.json
      - name: Build the production worker and private allocation contract
        run: |
          cargo build --locked -p goldenhoop-control --bin goldenhoopd --example network_allocation
          cargo build --locked -p goldenhoop-egress --example quarantine_readback --example policy_readback --example credential_redirect --example destination_plan
      - name: Verify actual owned credential redirect semantics and weakened-rule refusal
        run: python3 -B tests/credential_redirect_contract.py --binary target/debug/examples/credential_redirect --manager --output evidence/credential-redirect-readback.json
      - name: Verify actual private TCP redirection and original destination through inet floors
        run: python3 -B tests/credential_packet_contract.py --redirect-binary target/debug/examples/credential_redirect --policy-binary target/debug/examples/policy_readback --destination-binary target/debug/examples/destination_plan --output evidence/credential-packet-path.json
      - name: Verify actual owned quarantine semantics and weakened-rule refusal
        run: python3 -B tests/quarantine_readback_contract.py --binary target/debug/examples/network_allocation --readback-binary target/debug/examples/quarantine_readback --work-dir .test-work --output evidence/quarantine-readback.json
      - name: Verify durable controller epochs, dispatch recovery, native binding and collection
        run: python3 -B tests/controller_provider_contract.py --binary target/debug/examples/network_allocation --work-dir .test-work --output evidence/network-provider.json
      - name: Verify pre-native probe process loss and read-only worker collection
        shell: bash
        run: |
          set -euo pipefail
          for mode in reserve create-loss start-loss table-blocked; do
            python3 -B tests/native_probe_contract.py --binary target/debug/examples/network_allocation --worker-binary target/debug/goldenhoopd --work-dir .test-work --mode "$mode" --output "evidence/native-probe-$mode.json"
          done
      - name: Verify actual effective policy and finite lease readback without host access
        run: python3 -B tests/policy_readback_contract.py --binary target/debug/examples/policy_readback --output evidence/policy-readback.json
      - name: Verify production worker collection of actual expired owned rules
        run: python3 -B tests/worker_network_recovery_contract.py --binary target/debug/examples/network_allocation --worker-binary target/debug/goldenhoopd --work-dir .test-work --output evidence/worker-network-recovery.json --remove-image
      - name: Verify all owned prerequisite resources are absent
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(docker ps -a --filter label=dev.goldenhoop.test=credential-broker-fixture --format '{{.ID}}')"
          test -z "$(docker network ls --filter label=dev.goldenhoop.test=credential-broker-fixture --format '{{.ID}}')"
          test -z "$(docker ps -a --filter label=dev.goldenhoop.test=credential-redirect-readback --format '{{.ID}}')"
          test -z "$(docker ps -a --filter label=dev.goldenhoop.test=credential-packet-path --format '{{.ID}}')"
          test -z "$(docker network ls --filter label=dev.goldenhoop.test=credential-packet-path --format '{{.ID}}')"
          remaining=$(docker ps -a --filter label=dev.goldenhoop.test=network-contract --format '{{.ID}}')
          test -z "$remaining"
          test -z "$(docker ps -a --filter label=dev.goldenhoop.test=network-provider --format '{{.ID}}')"
          test -z "$(docker ps -a --filter label=dev.goldenhoop.role=egress-controller --format '{{.ID}}')"
          test -z "$(docker ps -a --filter label=dev.goldenhoop.role=native-probe --format '{{.ID}}')"
          test -z "$(docker network ls --filter label=dev.goldenhoop.role=egress-network --format '{{.ID}}')"
          test -z "$(docker volume ls --filter label=dev.goldenhoop.role=agent-bundle --format '{{.Name}}')"
          if docker image inspect goldenhoop-network-fixture:test >/dev/null 2>&1; then
            label=$(docker image inspect goldenhoop-network-fixture:test --format '{{index .Config.Labels "dev.goldenhoop.fixture"}}')
            test "$label" = network-interop
            remaining=$(docker ps -a --filter ancestor=goldenhoop-network-fixture:test --format '{{.ID}}')
            test -z "$remaining"
            docker image rm --no-prune goldenhoop-network-fixture:test
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-prerequisites
          path: evidence/
      - name: Collect the disposable host controller image
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if docker image inspect goldenhoop-egress:test >/dev/null 2>&1; then
            test "$(docker image inspect goldenhoop-egress:test --format '{{index .Config.Labels "dev.goldenhoop.egress"}}')" = host-netfilter
            test -z "$(docker ps -a --filter ancestor=goldenhoop-egress:test --format '{{.ID}}')"
            docker image rm --no-prune goldenhoop-egress:test
          fi
  routed-ipv4:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runtime: [runc, runsc]
    steps:
      - uses: actions/checkout@v4
      - name: Validate focused contract selection
        shell: bash
        run: |
          if [ "${{ inputs.creation_only }}" = true ] && [ "${{ inputs.credential_only }}" = true ]; then
            echo "::error::Choose at most one focused contract."
            exit 1
          fi
      - name: Install gVisor on the disposable CI runner
        if: matrix.runtime == 'runsc'
        shell: bash
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          base="https://storage.googleapis.com/gvisor/releases/release/latest/$(uname -m)"
          cd "$scratch"
          curl --fail --location --retry 3 "$base/gvisor.tar.zstd" -o gvisor.tar.zstd
          curl --fail --location --retry 3 "$base/gvisor.tar.zstd.sha512" -o gvisor.tar.zstd.sha512
          sha512sum -c gvisor.tar.zstd.sha512
          sudo tar --zstd -xf gvisor.tar.zstd -C /usr/local/bin
          sudo /usr/local/bin/runsc install
          sudo systemctl reload docker
          runsc --version
      - name: Build the actual agent base and public network fixture
        run: |
          docker build --label dev.goldenhoop.build=network-prototype -f images/agent/Dockerfile -t goldenhoop-agent:test .
          docker build --target host-egress -f images/agent/Dockerfile -t goldenhoop-egress:test .
          docker build -f tests/fixtures/network.Dockerfile -t goldenhoop-network-fixture:test .
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the production driver bootstrap and recovery contract
        run: |
          cargo build --locked -p goldenhoop-control --bin goldenhoopd --example network_allocation --example network_policy
          cargo build --locked -p goldenhoop-egress --example quarantine_readback
          cargo build --locked -p goldenhoop-cli
          cargo build --locked -p goldenhoop-client --example credential_contract
      - name: Verify guarded source, DNS, destination binding and owned worker collection
        if: ${{ !inputs.creation_only && !inputs.credential_only }}
        run: python3 -B tests/guarded_bootstrap_contract.py --runtime ${{ matrix.runtime }} --binary target/debug/examples/network_allocation --worker-binary target/debug/goldenhoopd --work-dir .test-work --output evidence/guarded-bootstrap-${{ matrix.runtime }}.json
      - name: Verify collection after actual process exit before trusted-agent start
        if: ${{ !inputs.creation_only && !inputs.credential_only }}
        run: python3 -B tests/guarded_bootstrap_contract.py --runtime ${{ matrix.runtime }} --mode prepared-exit --binary target/debug/examples/network_allocation --worker-binary target/debug/goldenhoopd --work-dir .test-work --output evidence/guarded-prepared-exit-${{ matrix.runtime }}.json
      - name: Verify exact DNS recovery after controller replacement and occupied-port refusal
        if: ${{ !inputs.creation_only && !inputs.credential_only }}
        run: python3 -B tests/dns_recovery_contract.py --runtime ${{ matrix.runtime }} --binary target/debug/examples/network_allocation --worker-binary target/debug/goldenhoopd --readback-binary target/debug/examples/quarantine_readback --work-dir .test-work --output evidence/dns-recovery-${{ matrix.runtime }}.json
      - name: Verify full protected policy readback, renewal, tightening and expiry
        if: ${{ !inputs.creation_only && !inputs.credential_only }}
        run: python3 -B tests/effective_policy_contract.py --runtime ${{ matrix.runtime }} --binary target/debug/examples/network_allocation --worker-binary target/debug/goldenhoopd --readback-binary target/debug/examples/quarantine_readback --work-dir .test-work --output evidence/effective-policy-${{ matrix.runtime }}.json
      - name: Verify worker-held policies, Ready gating, renewal and crash recovery
        if: ${{ !inputs.creation_only && !inputs.credential_only }}
        run: python3 -B tests/worker_network_policy_contract.py --runtime ${{ matrix.runtime }} --binary target/debug/examples/network_allocation --worker-binary target/debug/goldenhoopd --policy-binary target/debug/examples/network_policy --work-dir .test-work --output evidence/worker-network-policy-${{ matrix.runtime }}.json
      - name: Verify public policy API, Rust SDK, native acknowledgement and paused replay
        if: ${{ !inputs.creation_only && !inputs.credential_only }}
        run: python3 -B tests/public_network_policy_contract.py --runtime ${{ matrix.runtime }} --binary target/debug/examples/network_allocation --worker-binary target/debug/goldenhoopd --policy-binary target/debug/examples/network_policy --cli-binary target/debug/goldenhoop --work-dir .test-work --output evidence/public-network-policy-${{ matrix.runtime }}.json
      - name: Verify public protected creation, actual availability and five-level policy recovery
        if: ${{ !inputs.credential_only }}
        run: python3 -B tests/public_network_create_contract.py --runtime ${{ matrix.runtime }} --binary target/debug/goldenhoopd --cli target/debug/goldenhoop --work-dir .test-work --output evidence/public-network-create-${{ matrix.runtime }}.json
      - uses: actions/setup-python@v5
        if: ${{ !inputs.creation_only }}
        with:
          python-version: '3.11'
      - name: Install the credential SDK test dependency
        if: ${{ !inputs.creation_only }}
        run: python -m pip install httpx==0.28.1
      - name: Verify production HTTP TLS credentials audit rotation and native collection
        if: ${{ !inputs.creation_only }}
        run: python -B tests/credential_broker_contract.py --runtime ${{ matrix.runtime }} --binary target/debug/goldenhoopd --cli target/debug/goldenhoop --sdk-binary target/debug/examples/credential_contract --work-dir .test-work --output evidence/credential-broker-${{ matrix.runtime }}.json
      - name: Verify the IPv4 routed-filter mechanism and scoped collection
        if: ${{ !inputs.creation_only && !inputs.credential_only }}
        run: python3 -B tests/network_contract.py --runtime ${{ matrix.runtime }} --receiver-publication routed --ci-host-diagnostics --output evidence/network-ipv4-${{ matrix.runtime }}.json
      - name: Verify workload DNS interception, grants, source expiry and controller loss
        if: ${{ !inputs.creation_only && !inputs.credential_only }}
        run: python3 -B tests/frontend_contract.py --runtime ${{ matrix.runtime }} --receiver-publication routed --resolver-path owned --ci-host-diagnostics --output evidence/egress-${{ matrix.runtime }}.json
      - name: Verify Docker embedded resolver compatibility on runc
        if: ${{ !inputs.creation_only && !inputs.credential_only && matrix.runtime == 'runc' }}
        run: python3 -B tests/frontend_contract.py --runtime runc --receiver-publication routed --resolver-path embedded --ci-host-diagnostics --output evidence/egress-embedded-runc.json
      - name: Verify immutable Ethernet isolation and raw-frame controls
        if: ${{ !inputs.creation_only && !inputs.credential_only }}
        run: python3 -B tests/ethernet_contract.py --runtime ${{ matrix.runtime }} --receiver-publication routed --resolver-path owned --ci-host-diagnostics --output evidence/ethernet-${{ matrix.runtime }}.json
      - name: Verify actual dual-stack packet grants and DNS interception
        if: ${{ !inputs.creation_only && !inputs.credential_only }}
        run: python3 -B tests/ipv6_contract.py --runtime ${{ matrix.runtime }} --receiver-publication routed --ci-host-diagnostics --output evidence/ipv6-${{ matrix.runtime }}.json
      - name: Verify endpoint source binding and ARP/neighbor integrity
        if: ${{ !inputs.creation_only && !inputs.credential_only }}
        run: python3 -B tests/source_contract.py --runtime ${{ matrix.runtime }} --receiver-publication routed --ci-host-diagnostics --output evidence/source-${{ matrix.runtime }}.json
      - name: Verify protected destinations before and after translation and DNS grants
        if: ${{ !inputs.creation_only && !inputs.credential_only }}
        run: python3 -B tests/destination_contract.py --runtime ${{ matrix.runtime }} --receiver-publication routed --ci-host-diagnostics --output evidence/destination-${{ matrix.runtime }}.json
      - name: Verify owned containers and networks are absent
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(docker ps -a --filter label=dev.goldenhoop.test=credential-broker-fixture --format '{{.ID}}')"
          test -z "$(docker network ls --filter label=dev.goldenhoop.test=credential-broker-fixture --format '{{.ID}}')"
          test -z "$(docker ps -a --filter label=dev.goldenhoop.test=credential-redirect-readback --format '{{.ID}}')"
          remaining=$(docker ps -a --filter label=dev.goldenhoop.test=network-contract --format '{{.ID}}')
          test -z "$remaining"
          remaining=$(docker network ls --filter label=dev.goldenhoop.test=network-contract --format '{{.ID}}')
          test -z "$remaining"
          if docker image inspect goldenhoop-network-fixture:test >/dev/null 2>&1; then
            label=$(docker image inspect goldenhoop-network-fixture:test --format '{{index .Config.Labels "dev.goldenhoop.fixture"}}')
            test "$label" = network-interop
            remaining=$(docker ps -a --filter ancestor=goldenhoop-network-fixture:test --format '{{.ID}}')
            test -z "$remaining"
            docker image rm --no-prune goldenhoop-network-fixture:test
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-ipv4-${{ matrix.runtime }}
          path: evidence/
      - name: Collect the disposable host controller image
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if docker image inspect goldenhoop-egress:test >/dev/null 2>&1; then
            test "$(docker image inspect goldenhoop-egress:test --format '{{index .Config.Labels "dev.goldenhoop.egress"}}')" = host-netfilter
            test -z "$(docker ps -a --filter ancestor=goldenhoop-egress:test --format '{{.ID}}')"
            docker image rm --no-prune goldenhoop-egress:test
          fi
