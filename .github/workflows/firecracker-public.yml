name: Firecracker native public lifecycle
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
  M4_IMAGE: goldenhoop-m4-rootfs:${{ github.run_id }}-${{ github.run_attempt }}
  M4_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install httpx==0.28.1
      - name: Build the actual Rust API worker CLI driver and supervisor
        run: cargo build --locked -p goldenhoop-control -p goldenhoop-cli -p goldenhoop-firecracker
      - name: Build the actual Rust guest components
        # Full workspace checks remain mandatory in CI and stage acceptance.
        run: docker build --build-arg VALIDATE_WORKSPACE=0 --target microvm-rootfs --label dev.goldenhoop.task=m4-guest --label dev.goldenhoop.run="$M4_OWNER" --tag "$M4_IMAGE" --file images/agent/Dockerfile .
      - name: Require actual private and public native lifecycle recovery
        run: sudo -n env PYTHONPATH="$PWD/sdk/python/src" "$pythonLocation/bin/python3" -B tests/firecracker_guest_contract.py --driver-contract --public-contract --source-commit "$GITHUB_SHA" --binary "$PWD/target/debug/goldenhoop-firecracker" --control "$PWD/target/debug/goldenhoopd" --cli "$PWD/target/debug/goldenhoop" --image "$M4_IMAGE" --owner "$M4_OWNER" --output "$PWD/evidence/firecracker-public.json"
      - name: Collect the exact owned test image and positively observe absence
        if: always()
        shell: python
        run: |
          import json, os, subprocess
          image = os.environ['M4_IMAGE']
          def listed():
              return subprocess.check_output(['docker', 'image', 'ls', '--no-trunc', '--filter', 'reference='+image, '--format', '{{.ID}}']).strip()
          if listed():
              value = json.loads(subprocess.check_output(['docker', 'image', 'inspect', image]))[0]
              assert value['Config']['Labels']['dev.goldenhoop.run'] == os.environ['M4_OWNER']
              assert value['Config']['Labels']['dev.goldenhoop.task'] == 'm4-guest'
              subprocess.run(['docker', 'image', 'rm', image], check=True)
          assert not listed()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firecracker-public
          path: evidence/*.json
          if-no-files-found: error
