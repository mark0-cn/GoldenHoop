name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace -- --test-threads=2
      - name: Check the static guest ABI and exercise musl descriptor contracts
        if: runner.os == 'Linux'
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo clippy --locked --target x86_64-unknown-linux-musl -p goldenhoop-firecracker -p goldenhoop-init --all-targets -- -D warnings
          cargo test --locked --target x86_64-unknown-linux-musl -p goldenhoop-firecracker --lib lifecycle::descriptor::tests::
          cargo test --locked --target x86_64-unknown-linux-musl -p goldenhoop-firecracker --lib control::tests::
          cargo test --locked --target x86_64-unknown-linux-musl -p goldenhoop-init --lib
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install httpx==0.28.1
      - name: Python SDK protocol contracts
        env:
          PYTHONPATH: sdk/python/src
        run: python -B -m unittest discover -s sdk/python/tests -v
