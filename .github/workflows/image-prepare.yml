name: Isolated Rust image preparation
on:
  workflow_dispatch:
    inputs:
      component:
        description: Isolated component to validate
        type: choice
        default: prepare
        options: [prepare, rootfs]
permissions:
  contents: read
env:
  GH_IMAGE_OWNER: image-prepare-${{ github.run_id }}-${{ github.run_attempt }}
  GH_HOST_IMAGE: goldenhoop-image-host:${{ github.run_id }}-${{ github.run_attempt }}
  GH_BUILDER_IMAGE: goldenhoop-image-builder:${{ github.run_id }}-${{ github.run_attempt }}
  GH_TRACE_ROOT: /var/lib/gh-runsc-${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  runsc:
    if: inputs.component != 'rootfs'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install gVisor on this disposable runner
        shell: bash
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          base="https://storage.googleapis.com/gvisor/releases/release/latest/$(uname -m)"
          cd "$scratch"
          curl --fail --location --retry 3 "$base/gvisor.tar.zstd" -o gvisor.tar.zstd
          curl --fail --location --retry 3 "$base/gvisor.tar.zstd.sha512" -o gvisor.tar.zstd.sha512
          sha512sum -c gvisor.tar.zstd.sha512
          sudo tar --zstd -xf gvisor.tar.zstd -C /usr/local/bin
          sudo mkdir -m 0700 "$GH_TRACE_ROOT"
          printf '%s\n' "$GITHUB_SHA" | sudo tee "$GH_TRACE_ROOT/source-commit" >/dev/null
          sudo /usr/local/bin/runsc install -- --debug --strace --strace-syscalls=openat,openat2,newfstatat,statx,fstat,statfs,fstatfs,fchown,fchownat,chmod,fchmod,fchmodat,utimensat,fsync,fdatasync,mkdir,mkdirat,renameat,renameat2,readlink,readlinkat,symlinkat,link,linkat,unlink,unlinkat,lseek,ftruncate,copy_file_range,sendfile,getcwd,fcntl,execve,clone,clone3,setxattr --debug-log="$GH_TRACE_ROOT/trace.%ID%.%TIMESTAMP%.%COMMAND%.log"
          sudo systemctl reload docker
          runsc --version
          docker version
      - name: Build the actual trusted host service and static converter
        # Mandatory workspace checks remain in CI and stage acceptance. This
        # separate gate executes the exact source-built production components.
        run: |
          docker build --build-arg VALIDATE_WORKSPACE=0 --label dev.goldenhoop.task=m4-image-source-export-fixture --label dev.goldenhoop.owner="$GH_IMAGE_OWNER" --tag "$GH_HOST_IMAGE" --file images/host/Dockerfile .
          docker build --build-arg VALIDATE_WORKSPACE=0 --target image-builder --label dev.goldenhoop.task=m4-image-builder-fixture --label dev.goldenhoop.owner="$GH_IMAGE_OWNER" --tag "$GH_BUILDER_IMAGE" --file images/agent/Dockerfile .
      - name: Require actual default-runsc image preparation and collection
        run: python -B tests/image_prepare_contract.py --source-commit "$GITHUB_SHA" --image "$GH_HOST_IMAGE" --image-owner "$GH_IMAGE_OWNER" --builder-image "$GH_BUILDER_IMAGE" --builder-owner "$GH_IMAGE_OWNER" --remove-image --output evidence/image-prepare-runsc.json
      - name: Retain bounded actual file-syscall diagnostics and collect fenced logs
        if: always()
        run: sudo -n "$pythonLocation/bin/python3" -B tests/runsc_trace_contract.py --root "$GH_TRACE_ROOT" --source-commit "$GITHUB_SHA" --primary-report "$PWD/evidence/image-prepare-runsc.json" --output "$PWD/evidence/image-prepare-runsc-trace.json"
      - name: Collect exact owned images and confirm absence
        if: always()
        shell: python
        run: |
          import json, os, subprocess
          for image in [os.environ['GH_HOST_IMAGE'], os.environ['GH_BUILDER_IMAGE']]:
              def listed():
                  return subprocess.check_output(['docker','image','ls','--quiet','--filter','reference='+image]).strip()
              if listed():
                  observed=json.loads(subprocess.check_output(['docker','image','inspect',image]))[0]
                  assert observed['Config']['Labels']['dev.goldenhoop.owner']==os.environ['GH_IMAGE_OWNER']
                  subprocess.run(['docker','image','rm',image],check=True)
              assert not listed()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-prepare-runsc
          path: evidence/*.json
          if-no-files-found: error
  rootfs:
    if: inputs.component == 'rootfs'
    uses: ./.github/workflows/rootfs-inspection.yml
