name: Artifact backend contract
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  s3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p goldenhoop-artifacts --example s3_contract
      - name: Pull the pinned disposable S3 backend
        run: docker pull rustfs/rustfs@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
      - name: Exercise actual conditional writes, integrity and removal
        run: python3 -B tests/artifact_contract.py --binary target/debug/examples/s3_contract --output evidence/artifact-s3.json --remove-image
      - name: Verify no storage test containers remain
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          remaining=$(docker ps -a --filter label=dev.goldenhoop.test=artifact-contract --format '{{.ID}}')
          test -z "$remaining"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifact-s3
          path: evidence/
  api-s3:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install httpx==0.28.1
      - name: Build the actual agent, API and clients
        run: |
          docker build -f images/agent/Dockerfile -t goldenhoop-agent:test .
          cargo build --locked -p goldenhoop-control -p goldenhoop-cli
          cargo build --locked -p goldenhoop-client --example sdk_contract
      - run: docker pull rustfs/rustfs@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
      - name: Exercise S3-backed API, clients and actual worker crashes
        run: python -B tests/api_contract.py --binary target/debug/goldenhoopd --rust-client target/debug/examples/sdk_contract --cli target/debug/goldenhoop --artifact-backend s3 --remove-artifact-fixture-image --runtime runc --work-dir .test-work --output evidence/api-s3.json
      - name: Verify all owned test resources are absent
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          remaining=$(docker ps -a --filter label=dev.goldenhoop.installation --format '{{.ID}}')
          test -z "$remaining"
          remaining=$(docker volume ls --filter label=dev.goldenhoop.installation --format '{{.Name}}')
          test -z "$remaining"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-s3
          path: evidence/
